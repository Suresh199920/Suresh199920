<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06090C"/>
      <stop offset="1" stop-color="#0B1418"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37F5C9"/>
      <stop offset="0.55" stop-color="#36BCF7"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gaugeArc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37F5C9"/>
      <stop offset="1" stop-color="#36BCF7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#37F5C9" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Building -->
  <rect x="80" y="212" width="210" height="42" rx="4" fill="#16212B"/>
  <rect x="96" y="130" width="60" height="82" fill="#101A22"/>
  <rect x="168" y="96" width="60" height="116" fill="#101A22"/>
  <rect x="238" y="160" width="42" height="52" fill="#101A22"/>
  <!-- lit windows -->
  <rect x="102" y="138" width="14" height="14" fill="#37F5C9" opacity="0.85"/>
  <rect x="122" y="138" width="14" height="14" fill="#F72585" opacity="0.8"/>
  <rect x="102" y="162" width="14" height="14" fill="#36BCF7" opacity="0.9"/>
  <rect x="122" y="162" width="14" height="14" fill="#16212B"/>
  <rect x="174" y="104" width="14" height="14" fill="#36BCF7" opacity="0.9"/>
  <rect x="194" y="104" width="14" height="14" fill="#F72585" opacity="0.7"/>
  <rect x="174" y="128" width="14" height="14" fill="#37F5C9" opacity="0.8"/>
  <rect x="194" y="128" width="14" height="14" fill="#16212B"/>
  <rect x="174" y="152" width="14" height="14" fill="#36BCF7" opacity="0.9"/>
  <rect x="194" y="152" width="14" height="14" fill="#16212B"/>
  <rect x="174" y="176" width="14" height="14" fill="#F72585" opacity="0.6"/>
  <rect x="244" y="168" width="12" height="12" fill="#37F5C9" opacity="0.8"/>
  <rect x="262" y="168" width="12" height="12" fill="#16212B"/>
  <polygon points="90,212 180,120 270,212" fill="none" stroke="#36BCF7" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Brand -->
  <text x="330" y="120" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#37F5C9">BMS :: CONTROL SYSTEM v2.0</text>
  <text x="330" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF">K.Sureshkumar</text>
  <text x="332" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="url(#accent)" letter-spacing="3">MEP  ·  HVAC  ·  BMS ENGINEER</text>
  <text x="332" y="242" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8B949E">Facility intelligence · Energy efficiency · Smart buildings (IoT / AI)</text>

  <!-- Gauges -->
  <!-- TEMP gauge -->
  <path d="M 798 176 A 42 42 0 0 1 882 176" fill="none" stroke="#1C2A35" stroke-width="10" stroke-linecap="round"/>
  <path d="M 798 176 A 42 42 0 0 1 840 134" fill="none" stroke="url(#gaugeArc)" stroke-width="10" stroke-linecap="round"/>
  <line x1="840" y1="176" x2="840" y2="138" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="840" cy="176" r="5" fill="#16212B" stroke="#37F5C9" stroke-width="2"/>
  <text x="840" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">24.0°C</text>
  <text x="840" y="248" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8B949E" text-anchor="middle">ZONE TEMP</text>

  <!-- HUMIDITY gauge -->
  <path d="M 938 176 A 42 42 0 0 1 1022 176" fill="none" stroke="#1C2A35" stroke-width="10" stroke-linecap="round"/>
  <path d="M 938 176 A 42 42 0 0 1 954.6 132.3" fill="none" stroke="url(#gaugeArc)" stroke-width="10" stroke-linecap="round"/>
  <line x1="980" y1="176" x2="955" y2="133" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="980" cy="176" r="5" fill="#16212B" stroke="#36BCF7" stroke-width="2"/>
  <text x="980" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">55%</text>
  <text x="980" y="248" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8B949E" text-anchor="middle">RELATIVE HUMIDITY</text>

  <!-- EFFICIENCY gauge -->
  <path d="M 1078 176 A 42 42 0 0 1 1162 176" fill="none" stroke="#1C2A35" stroke-width="10" stroke-linecap="round"/>
  <path d="M 1078 176 A 42 42 0 0 1 1118.7 154.6" fill="none" stroke="url(#gaugeArc)" stroke-width="10" stroke-linecap="round"/>
  <line x1="1120" y1="176" x2="1118.7" y2="154.6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1120" cy="176" r="5" fill="#16212B" stroke="#7C3AED" stroke-width="2"/>
  <text x="1120" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">92%</text>
  <text x="1120" y="248" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8B949E" text-anchor="middle">ENERGY EFFICIENCY</text>

  <!-- Status LED -->
  <circle cx="1128" cy="34" r="6" fill="#37F5C9">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="1144" y="39" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#37F5C9">OPERATIONAL</text>

  <rect x="24" y="24" width="1152" height="272" rx="10" fill="none" stroke="#1C2A35" stroke-width="1.5"/>
</svg>